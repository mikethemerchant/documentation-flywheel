# edi-gateway.yaml — application inventory record
# Validated against ../../schema.yaml on every pull request.

name: EDI Gateway
purpose: >
  Translates and routes EDI documents to and from trading partners — purchase
  orders, acknowledgements, and invoices. The commercial boundary of the
  business: an outage here is visible to customers within hours.
vendor: Conduit
capability:
  - EDI & Trading Partner Exchange
  - Integration & Middleware
primary_users:
  - Supply Chain
  - Sales
it_sme: Sofia Marchetti
it_technical_owner: Sofia Marchetti
it_manager: Marcus Iwu
it_team_accountable: Data & Integrations
lifecycle_status: Active
hosting: Cloud (SaaS)

criticality_tier: Tier 1 - Critical
rto: 4 hours
rpo: 1 hour
recovery_owner: Sofia Marchetti

notes: >
  Carries the only inbound flow in the portfolio classified as unstoppable.
  Partners transmit on their own schedule and do not retry, so a document that
  arrives during an outage is lost at their end rather than queued at ours.

  2026-03-04 (integration review): partner onboarding runbook exists only as
  a document on the vendor portal, not in this repository. Action item open.
