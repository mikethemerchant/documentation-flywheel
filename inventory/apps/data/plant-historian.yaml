name: Plant Historian
purpose: >
  Time-series capture of line and machine telemetry at the two manufacturing
  sites. Feeds throughput and downtime reporting into the data warehouse.
vendor: Axiom Controls
capability:
  - Manufacturing Data Historian
primary_users:
  - Manufacturing
it_sme: Unknown
it_technical_owner: Tom Bergstrom
it_manager: Tom Bergstrom
it_team_accountable: Infrastructure
lifecycle_status: Active
hosting: On-Prem

criticality_tier: Tier 2 - Important
rto: 24 hours
rpo: 4 hours
recovery_owner: Tom Bergstrom

notes: >
  Infrastructure keeps the server patched and backed up; nobody in IT can
  explain the tag configuration, the retention policy, or which of the
  downstream reports depend on which tags. The platform has an owner and the
  application does not, and the record shows both — which is the whole point
  of keeping those two fields apart.

  2026-08-04 (infrastructure catchup): hosting resolved to On-Prem. It is a
  vendor appliance — a physical box in the plant electrical room, which Tom
  Bergstrom has stood next to. Closes Q-009.

  The boundary dispute is unchanged and was never the same question. The
  field sat at TBD for five months because "where does it run" and "whose
  network is it on" had been collapsed into one unanswerable thing; the first
  took thirty seconds to answer once it was asked on its own. Whether the box
  sits inside the plant network boundary or the corporate one is still
  contested — Q-007, insight 7 — and that is what decides who patches it.
