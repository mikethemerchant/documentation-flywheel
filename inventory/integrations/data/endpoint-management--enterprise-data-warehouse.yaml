# endpoint-management--enterprise-data-warehouse.yaml — integration record
# Slug convention: <source-slug>--<target-slug>

name: Endpoint Management → Enterprise Data Warehouse (EDW)
source: endpoint-management
target: enterprise-data-warehouse
direction: Outbound
connection_type: API (REST)
middleware: Direct (none)

dr_impact: Stoppable - no data loss
failover_behavior: >
  Vendor-side push on a nightly schedule, around 02:00. The endpoint
  management tenant holds its own device inventory and remains the system of
  record for it, so a missed run loses nothing — the next night's push carries
  the full state again rather than a delta. The visible effect of an outage is
  a compliance dashboard that is a day stale.

notes: >
  Asset and compliance data — device inventory, patch state, encryption
  status. Point-to-point; it does not pass through the integration platform.

  2026-08-04 (infrastructure catchup): recorded for the first time, from Tom
  Bergstrom. It has run since the tool was implemented and had never been
  written down — the application appeared on the gap report with zero
  integrations, which is the only reason anyone asked. "It's not a thing
  anyone thinks about, it's just been running."
